<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" width="1200" height="820" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <title>FindMe keyholder — ESP32-C3 circuit diagram</title>
  <desc>Point-to-point wiring for the FindMe keyholder as actually built: ESP32-C3 Super Mini with onboard SSD1306 72x40 OLED on GPIO 5 and 6, status LED with series resistor on GPIO 4, active 3 V buzzer on GPIO 10, momentary push button to ground on GPIO 7 using the internal pull-up, 1:2 resistive divider from the battery rail into ADC1 on GPIO 1, and a TP4056 charger between a single-cell LiPo and the board's regulator input. There is no GPS module: positions arrive from the paired phone over BLE.</desc>

  <defs>
    <style>
      .bg       { fill:#F7F8FC; }
      .board    { fill:#1E2A45; }
      .chip     { fill:#2C3A5E; }
      .mod      { fill:#FFFFFF; stroke:#C8CBDA; stroke-width:1.5; }
      .oled     { fill:#0B0E16; }
      .pad      { fill:#F4B23E; }
      .padtxt   { font-size:11px; font-weight:700; fill:#1E2A45; }
      .boardtxt { font-size:13px; font-weight:700; fill:#FFFFFF; }
      .boardsub { font-size:10.5px; fill:#9FB0D0; }
      .modtxt   { font-size:12.5px; font-weight:700; fill:#1E2A45; }
      .modsub   { font-size:10.5px; fill:#6B7390; }
      .w-sig    { stroke:#4234B3; stroke-width:2.6; fill:none; }
      .w-pwr    { stroke:#D1434A; stroke-width:2.6; fill:none; }
      .w-gnd    { stroke:#333A4D; stroke-width:2.6; fill:none; }
      .w-i2c    { stroke:#0E8A6A; stroke-width:2.6; fill:none; stroke-dasharray:7 4; }
      .lbl      { font-size:11px; fill:#474553; }
      .lblb     { font-size:11px; font-weight:700; fill:#1E2A45; }
      .ttl      { font-size:21px; font-weight:700; fill:#1E2A45; }
      .sub      { font-size:12.5px; fill:#6B7390; }
      .note     { font-size:11px; fill:#6B7390; }
      .sec      { font-size:10.5px; font-weight:700; fill:#8B889B; letter-spacing:1.1px; }
      .res      { fill:#FFFFFF; stroke:#1E2A45; stroke-width:2; }
      .node     { fill:#4234B3; }
      .gndsym   { stroke:#333A4D; stroke-width:2.6; fill:none; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1200" height="820"/>

  <text class="ttl" x="40" y="46">FindMe keyholder — circuit diagram</text>
  <text class="sub" x="40" y="68">ESP32-C3 Super Mini (0.42&quot; OLED variant) · single-cell LiPo · BLE only, no GPS module and no Wi-Fi</text>

  <!-- ============================= LEGEND ============================= -->
  <g transform="translate(830,36)">
    <text class="sec" x="0" y="0">LEGEND</text>
    <line class="w-pwr" x1="0" y1="16" x2="34" y2="16"/><text class="lbl" x="42" y="20">power</text>
    <line class="w-gnd" x1="0" y1="34" x2="34" y2="34"/><text class="lbl" x="42" y="38">ground</text>
    <line class="w-sig" x1="130" y1="16" x2="164" y2="16"/><text class="lbl" x="172" y="20">GPIO signal</text>
    <line class="w-i2c" x1="130" y1="34" x2="164" y2="34"/><text class="lbl" x="172" y="38">I²C (on-board)</text>
  </g>

  <!-- ============================= THE BOARD ============================= -->
  <g transform="translate(430,150)">
    <rect class="board" x="0" y="0" width="300" height="420" rx="12"/>
    <rect class="chip" x="96" y="150" width="108" height="86" rx="7"/>
    <text class="boardtxt" x="150" y="186" text-anchor="middle">ESP32-C3</text>
    <text class="boardsub" x="150" y="202" text-anchor="middle">RISC-V · BLE 5.0</text>
    <text class="boardsub" x="150" y="218" text-anchor="middle">4 MB flash</text>

    <text class="boardtxt" x="150" y="32" text-anchor="middle">Super Mini</text>
    <text class="boardsub" x="150" y="48" text-anchor="middle">USB-C · on-board LDO → 3.3 V</text>

    <!-- on-board OLED -->
    <rect class="oled" x="88" y="66" width="124" height="66" rx="5"/>
    <text class="boardsub" x="150" y="92" text-anchor="middle" style="fill:#7FE3C0">SSD1306</text>
    <text class="boardsub" x="150" y="108" text-anchor="middle" style="fill:#7FE3C0">72 × 40 · 0.42&quot;</text>
    <text class="boardsub" x="150" y="124" text-anchor="middle" style="fill:#6B7A9C">soldered to the board</text>

    <text class="boardsub" x="150" y="404" text-anchor="middle">GPIO 8 / 9 are the boot strapping pins — left unused</text>

    <!-- LEFT PADS -->
    <g>
      <rect class="pad" x="-52" y="258" width="52" height="22" rx="4"/><text class="padtxt" x="-26" y="273" text-anchor="middle">GPIO 4</text>
      <rect class="pad" x="-52" y="300" width="52" height="22" rx="4"/><text class="padtxt" x="-26" y="315" text-anchor="middle">GPIO 10</text>
      <rect class="pad" x="-52" y="342" width="52" height="22" rx="4"/><text class="padtxt" x="-26" y="357" text-anchor="middle">GPIO 7</text>
    </g>

    <!-- RIGHT PADS -->
    <g>
      <rect class="pad" x="300" y="258" width="52" height="22" rx="4"/><text class="padtxt" x="326" y="273" text-anchor="middle">GPIO 1</text>
      <rect class="pad" x="300" y="300" width="52" height="22" rx="4"/><text class="padtxt" x="326" y="315" text-anchor="middle">5V</text>
      <rect class="pad" x="300" y="342" width="52" height="22" rx="4"/><text class="padtxt" x="326" y="357" text-anchor="middle">GND</text>
    </g>

    <!-- internal I2C hint -->
    <line class="w-i2c" x1="150" y1="132" x2="150" y2="150"/>
    <text class="lbl" x="162" y="146" style="fill:#7FE3C0">GPIO 5 = SDA · GPIO 6 = SCL</text>
  </g>

  <!-- ============================= LED ============================= -->
  <g>
    <text class="sec" x="40" y="212">STATUS LED</text>
    <rect class="mod" x="40" y="228" width="236" height="86" rx="9"/>
    <text class="modtxt" x="58" y="254">Red LED, 3 mm</text>
    <text class="modsub" x="58" y="272">220 Ω in series · ≈ 7 mA</text>
    <text class="modsub" x="58" y="290">Mirrors the buzzer: on when the</text>
    <text class="modsub" x="58" y="304">alert is sounding, off otherwise.</text>

    <!-- GPIO 4 -> resistor -> LED -> GND -->
    <line class="w-sig" x1="378" y1="269" x2="330" y2="269"/>
    <rect class="res" x="296" y="261" width="34" height="16" rx="2"/>
    <text class="lblb" x="313" y="253" text-anchor="middle">220Ω</text>
    <line class="w-sig" x1="296" y1="269" x2="276" y2="269"/>
    <line class="w-gnd" x1="40" y1="269" x2="22" y2="269"/>
    <line class="w-gnd" x1="22" y1="269" x2="22" y2="620"/>
  </g>

  <!-- ============================= BUZZER ============================= -->
  <g>
    <text class="sec" x="40" y="352">AUDIBLE ALERT</text>
    <rect class="mod" x="40" y="368" width="236" height="104" rx="9"/>
    <circle cx="86" cy="408" r="18" fill="#1E2A45"/>
    <circle cx="86" cy="408" r="5" fill="#F7F8FC"/>
    <text class="modtxt" x="116" y="400">Active buzzer</text>
    <text class="modsub" x="116" y="416">3 V, self-oscillating</text>
    <text class="modsub" x="58" y="440">Driven with digitalWrite() only. It</text>
    <text class="modsub" x="58" y="454">generates its own tone, so tone() on</text>
    <text class="modsub" x="58" y="468">this pin produces a thin rattle.</text>

    <line class="w-sig" x1="378" y1="311" x2="300" y2="311"/>
    <line class="w-sig" x1="300" y1="311" x2="300" y2="394"/>
    <line class="w-sig" x1="300" y1="394" x2="276" y2="394"/>
    <text class="lblb" x="310" y="350">+</text>
    <line class="w-gnd" x1="40" y1="430" x2="22" y2="430"/>
    <circle class="node" cx="22" cy="430" r="3.5"/>
  </g>

  <!-- ============================= BUTTON ============================= -->
  <g>
    <text class="sec" x="40" y="510">PUSH BUTTON</text>
    <rect class="mod" x="40" y="526" width="236" height="104" rx="9"/>
    <text class="modtxt" x="58" y="552">Momentary, to ground</text>
    <text class="modsub" x="58" y="570">INPUT_PULLUP — no external resistor</text>
    <text class="modsub" x="58" y="588">Short press → ring the phone.</text>
    <text class="modsub" x="58" y="602">Held 10 s → factory reset.</text>
    <text class="modsub" x="58" y="620">50 ms software debounce.</text>

    <line class="w-sig" x1="378" y1="353" x2="340" y2="353"/>
    <line class="w-sig" x1="340" y1="353" x2="340" y2="556"/>
    <line class="w-sig" x1="340" y1="556" x2="276" y2="556"/>
    <line class="w-gnd" x1="40" y1="600" x2="22" y2="600"/>
    <circle class="node" cx="22" cy="600" r="3.5"/>

    <!-- ground symbol -->
    <g transform="translate(22,620)">
      <line class="gndsym" x1="0" y1="0" x2="0" y2="12"/>
      <line class="gndsym" x1="-16" y1="12" x2="16" y2="12"/>
      <line class="gndsym" x1="-10" y1="18" x2="10" y2="18"/>
      <line class="gndsym" x1="-4" y1="24" x2="4" y2="24"/>
      <text class="lblb" x="0" y="42" text-anchor="middle">GND</text>
    </g>
  </g>

  <!-- ============================= BATTERY SENSE ============================= -->
  <g>
    <text class="sec" x="900" y="212">BATTERY SENSE</text>
    <rect class="mod" x="900" y="228" width="262" height="150" rx="9"/>
    <text class="modtxt" x="918" y="254">1 : 2 resistive divider</text>
    <text class="modsub" x="918" y="272">R1 = R2 = 100 kΩ → ratio 2.0</text>
    <text class="modsub" x="918" y="290">ADC1 on GPIO 1, 12-bit, 11 dB</text>
    <text class="modsub" x="918" y="304">attenuation. analogReadMilliVolts()</text>
    <text class="modsub" x="918" y="318">is used, so the per-chip factory</text>
    <text class="modsub" x="918" y="332">calibration is applied for us.</text>
    <text class="modsub" x="918" y="352">4.20 V → 100 % · 3.00 V → 0 %.</text>
    <text class="modsub" x="918" y="366">±3 % hysteresis stops the digit flickering.</text>

    <!-- divider drawing -->
    <g transform="translate(800,250)">
      <line class="w-pwr" x1="0" y1="0" x2="0" y2="34"/>
      <rect class="res" x="-9" y="34" width="18" height="40" rx="2"/>
      <text class="lblb" x="-16" y="60" text-anchor="end">R1</text>
      <line class="w-sig" x1="0" y1="74" x2="0" y2="92"/>
      <circle class="node" cx="0" cy="83" r="4"/>
      <line class="w-sig" x1="0" y1="83" x2="-70" y2="83"/>
      <text class="lbl" x="-66" y="76">V/2 → ADC</text>
      <rect class="res" x="-9" y="92" width="18" height="40" rx="2"/>
      <text class="lblb" x="-16" y="118" text-anchor="end">R2</text>
      <line class="w-gnd" x1="0" y1="132" x2="0" y2="160"/>
      <line class="w-gnd" x1="0" y1="160" x2="60" y2="160"/>
    </g>
    <line class="w-sig" x1="730" y1="333" x2="730" y2="269"/>
    <line class="w-sig" x1="730" y1="269" x2="782" y2="269"/>
  </g>

  <!-- ============================= POWER ============================= -->
  <g>
    <text class="sec" x="900" y="440">POWER AND CHARGING</text>
    <rect class="mod" x="900" y="456" width="262" height="196" rx="9"/>
    <text class="modtxt" x="918" y="482">TP4056 charging module</text>
    <text class="modsub" x="918" y="500">Micro-USB in · CC/CV at 4.2 V</text>
    <text class="modsub" x="918" y="514">Programming resistor sets the rate;</text>
    <text class="modsub" x="918" y="528">keep it at or below 0.5 C.</text>
    <text class="modsub" x="918" y="552">Protection IC (DW01 + dual FET) cuts</text>
    <text class="modsub" x="918" y="566">the cell off below ≈ 2.4 V, so the</text>
    <text class="modsub" x="918" y="580">firmware&apos;s 0 % at 3.00 V stops long</text>
    <text class="modsub" x="918" y="594">before the cell is damaged.</text>
    <text class="modtxt" x="918" y="620">LiPo, 1S 3.7 V</text>
    <text class="modsub" x="918" y="638">OUT+ feeds the board&apos;s 5V pad; the LDO</text>
    <text class="modsub" x="918" y="652">regulates it down to 3.3 V.</text>

    <!-- battery cell symbol -->
    <g transform="translate(790,540)">
      <rect x="-26" y="0" width="52" height="76" rx="6" fill="#FFFFFF" stroke="#1E2A45" stroke-width="2"/>
      <rect x="-26" y="0" width="52" height="24" rx="6" fill="#D1434A"/>
      <text class="lblb" x="0" y="17" text-anchor="middle" style="fill:#FFFFFF">+</text>
      <text class="modsub" x="0" y="48" text-anchor="middle">LiPo</text>
      <text class="modsub" x="0" y="62" text-anchor="middle">3.7 V</text>
      <line class="w-pwr" x1="0" y1="0" x2="0" y2="-26"/>
      <line class="w-pwr" x1="0" y1="-26" x2="-60" y2="-26"/>
      <line class="w-gnd" x1="0" y1="76" x2="0" y2="96"/>
      <line class="w-gnd" x1="0" y1="96" x2="-80" y2="96"/>
    </g>

    <!-- OUT+ to 5V pad -->
    <line class="w-pwr" x1="730" y1="514" x2="800" y2="514"/>
    <line class="w-pwr" x1="800" y1="514" x2="800" y2="250"/>
    <circle class="node" cx="800" cy="514" r="4" style="fill:#D1434A"/>
    <text class="lblb" x="742" y="506">5V</text>
    <text class="note" x="742" y="534">the divider taps this same node</text>

    <!-- GND to GND pad -->
    <line class="w-gnd" x1="730" y1="636" x2="710" y2="636"/>
    <line class="w-gnd" x1="710" y1="636" x2="710" y2="410"/>
    <line class="w-gnd" x1="710" y1="410" x2="860" y2="410"/>
    <text class="lblb" x="742" y="628">GND</text>
  </g>

  <!-- ============================= NOT PRESENT ============================= -->
  <g transform="translate(40,676)">
    <rect x="0" y="0" width="690" height="112" rx="9" fill="#FFF8E8" stroke="#F4B23E" stroke-width="1.5"/>
    <text class="modtxt" x="18" y="26">What is deliberately not on this board</text>
    <text class="modsub" x="18" y="46">· No GPS module. Earlier drafts wired a NEO-6M to GPIO 20/21. It was removed because a receiver</text>
    <text class="modsub" x="18" y="60">  inside the keyholder can only be read while a BLE link is up — which is exactly not the case the</text>
    <text class="modsub" x="18" y="74">  instant the keys are left behind. The phone&apos;s own receiver is available then. Positions now travel</text>
    <text class="modsub" x="18" y="88">  phone → keyholder as PHONE_LOC:, and the screen shows where the phone was, not where the keys are.</text>
    <text class="modsub" x="18" y="104">· No Wi-Fi and no cloud radio. Wi-Fi and BLE share one antenna on the C3; coexistence roughly doubles average current.</text>
  </g>

  <g transform="translate(750,676)">
    <rect x="0" y="0" width="412" height="112" rx="9" fill="#EEF3FF" stroke="#4234B3" stroke-width="1.5"/>
    <text class="modtxt" x="18" y="26">Pin map</text>
    <text class="modsub" x="18" y="46">GPIO 5 → OLED SDA (on board)   GPIO 6 → OLED SCL (on board)</text>
    <text class="modsub" x="18" y="62">GPIO 4 → status LED            GPIO 10 → active buzzer</text>
    <text class="modsub" x="18" y="78">GPIO 7 → button (pull-up)      GPIO 1 → battery ADC</text>
    <text class="modsub" x="18" y="98">Mirrored in Myprojctcode.ino and firmware/README.md. Change one, change all three.</text>
  </g>
</svg>
