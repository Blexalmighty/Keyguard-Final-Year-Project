name: keyguard
description: "FindX — a two-way BLE proximity alert system for personal item recovery. Flutter app for the FindMe ESP32-C3 keyholder."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.11.5

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  flutter_blue_plus: ^1.35.0
  permission_handler: ^11.3.1
  connectivity_plus: ^6.0.5

  # Keeps the app's process alive once the owner leaves the screen.
  #
  # Not for running code in a second isolate — the whole point is the opposite.
  # An Android app with no foreground service is a cached process, first in line
  # to be killed when memory is short, which is why the app died the moment it
  # was backgrounded. A foreground service moves it out of that queue, and
  # because the service lives in the same process, the main isolate's BLE
  # connection, RSSI polling and timers simply keep running. See
  # services/background_service.dart.
  flutter_foreground_task: ^11.0.3

  # Non-secret settings (toggles, RSSI calibration, demo mode).
  shared_preferences: ^2.3.2
  # Owner identity + per-device shared secret. Deliberately NOT shared_preferences:
  # key material belongs in the Android Keystore, not in plain prefs.
  flutter_secure_storage: ^9.2.2
  # HMAC-SHA256 for the owner challenge-response handshake.
  crypto: ^3.0.5

  # --- Find-My-Phone ringing (the keyholder's button rings the phone) ---------
  # Plays a chosen audio file on a loop. Configured to use Android's *alarm*
  # stream, which is what lets the ring be heard when the ringer is on silent —
  # a phone lost under a cushion is usually a phone on silent.
  audioplayers: ^6.8.1
  # Plays the phone's own system ringtone / alarm / notification sound. There is
  # no way to read the user's default ringtone as a file path, so "use my normal
  # ringtone" has to go through this rather than through audioplayers.
  flutter_ringtone_player: ^4.0.0+4
  # Lets the owner pick an audio file from storage. Uses the system document
  # picker, so it can reach files this app has no blanket permission to browse.
  file_picker: ^11.0.3
  # Continuous vibration alongside the sound. A muffled phone is often found by
  # feel before it is found by ear.
  vibration: ^3.2.1
  # Somewhere permanent to copy a picked ringtone to. The picker hands back a
  # cache path that Android is free to delete, so the raw path cannot be stored.
  path_provider: ^2.1.6
  # The system notifications this app posts: a heads-up when the keyholder
  # crosses half the alert distance, a louder one when it passes the distance the
  # owner set, and a quiet note when the link comes up or goes down. Each has its
  # own channel, so the owner can mute the connection chatter without muting the
  # warning that matters.
  flutter_local_notifications: ^18.0.1
  # Where the phone is. The keyholder's own GPS is only reachable while there is a
  # link to ask over — which is precisely not the case at the moment the link
  # drops, the instant a position is most wanted. The phone's receiver is
  # available then, and needs no satellites of its own.
  #
  # Resolves to 14.0.2, not 14.0.3: 14.0.3 pulls package_info_plus, which wants
  # win32 ^6, and file_picker 11 pins win32 ^5.9. The alternative was a major
  # version bump of file_picker, which would put the ringtone picker at risk for
  # the sake of a patch release with nothing in it we use.
  geolocator: ^14.0.2
  # Hands a position to the phone's maps app. Chosen over google_maps_flutter,
  # which needs a Maps SDK key and a billing account, and which renders a blank
  # grey square without one — indistinguishable, on the location card, from
  # "no fix yet". See lib/utils/maps_launcher.dart.
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true

  # Poppins is bundled rather than fetched through `google_fonts`, which
  # downloads on first launch — so the app looked wrong until it had internet.
  # Four weights cover every style in lib/theme/app_theme.dart; adding more would
  # only grow the APK.
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700

